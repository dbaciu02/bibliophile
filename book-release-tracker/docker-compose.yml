# Local development database only. Staging/production use managed Postgres
# with their own credentials (requirement D3); these values are dev-only.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: booktracker
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d booktracker"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dbdata:
