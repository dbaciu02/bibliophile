# CI/CD (D4). On every pull request: typecheck + all tests.
# On every push to main: the same, then
#   build the API image (tagged with the commit, digest recorded)
#   -> deploy it and the website to STAGING
#   -> gate: staging /healthz must report this commit, then smoke checks.
# Production is a separate, manual step (promote.yml) that only accepts a
# commit that is currently healthy on staging (D3: changes go through staging).
# The project lives in ./book-release-tracker/ of this repository, so every `run:` step
# starts there (defaults.run.working-directory) and file paths given to
# actions are prefixed with book-release-tracker/.
name: deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false # never cut a deploy off halfway

permissions:
  contents: read

defaults:
  run:
    working-directory: book-release-tracker

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: booktracker_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/booktracker_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: book-release-tracker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:mcp-app
      - run: npm test

  image:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
      - id: ref
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bibliophile-api" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: book-release-tracker
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: ${{ steps.ref.outputs.image }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          provenance: false # a single plain manifest, so Render can pull it by digest
      - name: Record commit and digest
        run: |
          {
            echo "### API image"
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| image | \`${{ steps.ref.outputs.image }}:sha-${{ github.sha }}\` |"
            echo "| digest | \`${{ steps.build.outputs.digest }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  staging:
    if: github.event_name != 'pull_request'
    needs: image
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.WEB_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # to compare with the previous push (website changed?)
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: book-release-tracker/package-lock.json
      - name: Check the staging environment is configured
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          SITE: ${{ secrets.NETLIFY_SITE_ID }}
          TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          API_URL: ${{ vars.API_URL }}
          WEB_URL: ${{ vars.WEB_URL }}
        run: |
          missing=""
          [ -n "$HOOK" ] || missing="$missing RENDER_DEPLOY_HOOK"
          [ -n "$SITE" ] || missing="$missing NETLIFY_SITE_ID"
          [ -n "$TOKEN" ] || missing="$missing NETLIFY_AUTH_TOKEN"
          [ -n "$API_URL" ] || missing="$missing API_URL"
          [ -n "$WEB_URL" ] || missing="$missing WEB_URL"
          if [ -n "$missing" ]; then
            echo "::error::Not set for the staging environment:$missing (see docs/deployment.md, section 8). The image was built and pushed; re-run this job once they're set."
            exit 1
          fi
      - name: Deploy API image to Render (staging)
        run: scripts/deploy/render-deploy.sh "${{ secrets.RENDER_DEPLOY_HOOK }}" "${{ needs.image.outputs.image }}@${{ needs.image.outputs.digest }}"
      - name: "Gate: staging /healthz reports this commit"
        run: scripts/deploy/wait-healthy.sh "${{ vars.API_URL }}" "${{ github.sha }}" 900
      # Netlify charges credits per production deploy (D11), so the site is only
      # redeployed when the website code differs from what the LIVE site runs
      # (its /version.json names the commit it was built from).
      - name: Does the live site need this build?
        id: web
        run: |
          live=$(curl -s --max-time 30 "${{ vars.WEB_URL }}/version.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(JSON.parse(s).commit??"")}catch{}})')
          echo "live site is on: ${live:-unknown (no version.json yet)}"
          if [ -n "$live" ] && git cat-file -e "$live^{commit}" 2>/dev/null \
             && git diff --quiet "$live" "$GITHUB_SHA" -- web package-lock.json; then
            echo "No changes under web/ since $live: keeping the deployed site."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build website for staging
        if: steps.web.outputs.changed == 'true'
        run: npm ci && npm run build --workspace web
        env:
          CI: "true"
          BUILD_COMMIT: ${{ github.sha }}
          VITE_API_BASE_URL: ${{ vars.API_URL }}
          VITE_ENTRA_TENANT_ID: ${{ vars.VITE_ENTRA_TENANT_ID }}
          VITE_ENTRA_CLIENT_ID: ${{ vars.VITE_ENTRA_CLIENT_ID }}
          VITE_ENTRA_API_CLIENT_ID: ${{ vars.VITE_ENTRA_API_CLIENT_ID }}
      - name: Deploy website to Netlify (staging)
        if: steps.web.outputs.changed == 'true'
        run: >-
          npx --yes netlify-cli@latest deploy --dir web/dist --prod
          --site "${{ secrets.NETLIFY_SITE_ID }}" --message "${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      - name: Smoke checks
        run: scripts/deploy/smoke.sh "${{ vars.WEB_URL }}" "${{ vars.API_URL }}"
      - name: Record
        run: |
          {
            echo "### Staging is on \`${{ github.sha }}\`"
            echo "- image: \`${{ needs.image.outputs.image }}@${{ needs.image.outputs.digest }}\`"
            echo "- site: ${{ vars.WEB_URL }} · API: ${{ vars.API_URL }}"
            echo "- To release it: Actions → **promote** → Run workflow with commit \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
